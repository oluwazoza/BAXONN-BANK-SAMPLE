<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAXONN BANK - Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>BAXONN BANK</h1>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Your password" required>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn">Log in</button>
    </form>
    <p class="muted">New here? <a href="register.html">Create an account</a></p>
  </main>
    <div id="login-modal" class="modal" hidden>
    <div class="modal-box">
      <h2>Enter activation code</h2>
      <p class="muted">Enter the 6-digit code to finish logging in.</p>
            <p id="login-code-hint" class="muted"></p>
      <form id="login-code-form">
            <p class="muted">New here? <a href="register.html">Create an account</a></p>
        <input id="login-code" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" required>
        <p id="login-code-msg" class="error" hidden></p>
        <button type="submit" class="btn">Confirm</button>
        <button type="button" id="login-code-cancel" class="btn-link">Cancel</button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
