<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAXONN BANK - Staff accounts</title>
  <link rel="stylesheet" href="style.css">
  <style>
    [hidden] { display: none !important; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <strong>BAXONN BANK staff: accounts</strong>
    <a href="admin.html" style="color:#fff">Staff chat</a>
  </header>
  <main class="wrap">
    <p id="need-login" class="error" hidden>Not logged in as staff. <a href="admin.html">Log in on the staff chat page</a> first, then come back and refresh.</p>
    <section id="content" hidden>
      <div class="panel scroll">
        <h2>Accounts</h2>
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Account number</th><th>Balance</th></tr></thead>
          <tbody id="accounts"></tbody>
        </table>
      </div>
      <div class="panel scroll" style="margin-top:20px">
        <h2>Latest transactions</h2>
        <table>
          <thead><tr><th>Time</th><th>Customer</th><th>Details</th><th>Amount</th></tr></thead>
          <tbody id="txs"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const money = (n) => (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function addRow(tbodyId, cells) {
      const tr = document.createElement("tr");
      cells.forEach((text) => {
        const td = document.createElement("td");
        td.textContent = text;
        tr.append(td);
      });
      document.getElementById(tbodyId).append(tr);
    }

    async function load() {
      const a = await fetch("/api/admin/accounts");
      if (!a.ok) {
        document.getElementById("need-login").hidden = false;
        return;
      }
      document.getElementById("content").hidden = false;
      (await a.json()).forEach((u) => addRow("accounts", [u.name, u.email, u.account_number, money(u.balance)]));
      const t = await fetch("/api/admin/all-transactions");
      (await t.json()).forEach((x) => addRow("txs", [x.created_at, x.name, x.label, money(x.amount)]));
    }
    load();
  </script>
</body>
</html>
